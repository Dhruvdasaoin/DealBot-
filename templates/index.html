<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DealBot Dashboard</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 800px;
            width: 100%;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 {
            color: #2c3e50;
            text-align: center;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        .stat-card {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            border: 1px solid #e9ecef;
        }
        .stat-card h3 {
            margin: 0 0 10px 0;
            color: #6c757d;
            font-size: 1.1em;
        }
        .stat-card p {
            margin: 0;
            font-size: 2em;
            font-weight: bold;
            color: #2c3e50;
        }
        .status-online {
            color: #27ae60;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>DealBot Dashboard</h1>
        
        <div class="stats-grid">
            <div class="stat-card">
                <h3>Total Deals This Month</h3>
                <p>{{ total_deals }}</p>
            </div>
            
            <div class="stat-card">
                <h3>Most Popular Category</h3>
                <p>{{ popular_category }}</p>
            </div>
            
            <div class="stat-card">
                <h3>Bot Status</h3>
                <p class="status-online">{{ bot_status }}</p>
            </div>
        </div>
    </div>
</body>
</html>
